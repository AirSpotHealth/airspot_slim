# UART console on P1.02 TX / P1.03 RX @ 115200 (debug connector on Slim PCB).
# Use when you have a USB-serial adapter on those pins (not the nRF DK USB port).
#
# west build -b nrf54l15dk/nrf54l05/cpuapp --sysbuild -d build \
#   -- -DEXTRA_CONF_FILE=prj_uart.conf

# Same as default prj.conf; kept for explicit west EXTRA_CONF_FILE builds.
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
