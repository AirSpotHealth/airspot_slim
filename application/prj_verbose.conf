# Verbose logging overlay — may exceed primary-slot size with current partitions.
# Only use after enlarging mcuboot_primary_app in pm_static.yml, or for --no-sysbuild builds.
#
# west build -b nrf54l15dk/nrf54l05/cpuapp --sysbuild -d build \
#   -- -DEXTRA_CONF_FILE=prj_verbose.conf

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y
