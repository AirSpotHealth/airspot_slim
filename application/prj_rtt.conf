# SEGGER RTT logs over the J-Link / SWD cable (no UART wiring required).
# This is the recommended way to view logs while developing with a debugger.
#
# west build -b nrf54l15dk/nrf54l05/cpuapp --sysbuild -d build \
#   -- -DEXTRA_CONF_FILE=prj_rtt.conf
#
# View: airspot logs rtt   (or J-Link RTT Viewer)

CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_RTT=y
