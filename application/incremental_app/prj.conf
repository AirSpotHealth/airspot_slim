# Incremental App - Starting with DFU
# Build features incrementally: DFU -> LEDs -> Sensors -> BT -> ADC

# =============================================================================
# Basic System Configuration
# =============================================================================
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# =============================================================================
# DFU via MCUboot + SMP over BLE (PHASE 1 - CRITICAL)
# TEMPORARILY DISABLED to test if MCUboot is causing SPI flash issue
# =============================================================================
# CONFIG_BOOTLOADER_MCUBOOT=y
# CONFIG_MCUMGR=y
# CONFIG_MCUMGR_TRANSPORT_BT=y
# CONFIG_MCUMGR_GRP_IMG=y
# CONFIG_MCUMGR_GRP_OS=y
# CONFIG_IMG_MANAGER=y
# CONFIG_STREAM_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_FLASH=y
# CONFIG_FLASH_PAGE_LAYOUT=y

# =============================================================================
# Basic BLE (required for MCUmgr BT transport)
# RE-ENABLING ONE BY ONE to find which feature interferes with SPI
# =============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AirSpot Incremental"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_BAS=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_REBOOT=y

# =============================================================================
# Clock (required for most peripherals)
# =============================================================================
CONFIG_CLOCK_CONTROL_NRF=y

# =============================================================================
# TODO: Add features incrementally below
# =============================================================================
# Phase 2: LEDs - RE-ENABLED to test if this interferes with SPI
CONFIG_LED=y

# Phase 3: Sensors (I2C) - RE-ENABLED to test if this interferes with SPI
CONFIG_I2C=y

# Phase 4: External Flash (SPI) - using Zephyr SPI NOR driver
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_FLASH=y
# Disable SPI-NOR driver for now (flash_test parity). We'll re-enable once
# basic JEDEC reads are stable.
CONFIG_SPI_NOR=n
# CONFIG_SPI_NOR_SFDP_RUNTIME=n
# MCUboot uses internal flash secondary slot (external flash for app storage only)
# CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y

# Phase 5: Settings/NVS
# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_NVS=y
# CONFIG_NVS=y

# =============================================================================
# Phase 7: ADC for Battery Monitoring
# =============================================================================
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# Phase 8: BT Mesh (for nRF54L10 - leave for later)
# CONFIG_BT_MESH=y
