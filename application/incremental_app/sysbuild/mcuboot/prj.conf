# MCUboot prj.conf - ENABLE SPI NOR, DISABLE SIGNATURE (Fit in Flash)

CONFIG_FLASH=y
CONFIG_SPI=n
CONFIG_SPI_NOR=n
CONFIG_GPIO=y

# CRITICAL: Enable peripheral cleanup to reset SPI and other peripherals after chainload
# This ensures SPI peripheral state is properly reset before application starts
CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL=y

# DISABLE Signature Validation to save space (crypto lib is huge)
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_SIGNATURE_TYPE_RSA=n
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=n
CONFIG_BOOT_VALIDATE_SLOT0=n

# Size Optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_ASSERT=n
CONFIG_DEBUG=n

# Minimal Libc
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
