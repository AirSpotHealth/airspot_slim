# Debug overlay — higher log levels (UART is already default in prj.conf).
#
# Build:
#   west build -b nrf54l15dk/nrf54l05/cpuapp --sysbuild -d build \
#     -- -DEXTRA_CONF_FILE=prj_debug.conf
# Or: ./build.sh --debug

# Same UART/log mode as prj.conf (MINIMAL). Raises module levels only.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_AIRSPOT_LOG_LEVEL=4
