CONFIG_AIRSPOT_SENSOR_NATIVE_ONLY=y
CONFIG_AIRSPOT_STCC4_CONDITION_ON_BOOT=y
CONFIG_AIRSPOT_CONTINUOUS_ALL_MODES=y
# Avoid per-sample formatting/RTT output; retain error logs and BLE diagnostics.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_AIRSPOT_LOG_LEVEL=1
CONFIG_PRINTK=y
# Request skipping up to four idle connection events (central may decline).
# 30–50 ms interval, <=250 ms idle attendance, existing 4 s timeout retained.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
