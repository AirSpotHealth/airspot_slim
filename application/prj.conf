# AirSpot Slim Firmware - Phase 9: MCUboot DFU + OTA Updates
# Full-featured firmware with BLE, NUS, sensor management, data logging, and OTA updates.

# =============================================================================
# Basic System Configuration
# =============================================================================
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# =============================================================================
# UART/Logging - ENABLED for debugging
# Disable for production to save power
# =============================================================================
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_AIRSPOT_LOG_LEVEL=3

# Float printf support (for sensor values)
CONFIG_CBPRINTF_FP_SUPPORT=y

# =============================================================================
# Clock (required for peripherals)
# =============================================================================
CONFIG_CLOCK_CONTROL_NRF=y

# =============================================================================
# BLE Configuration
# =============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Device name set dynamically in ble_service.c as "AirSpot-XXXXXX" (MAC suffix)
CONFIG_BT_DEVICE_NAME="AirSpot"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=20
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Battery Service (BAS) - auto-reports battery level
CONFIG_BT_BAS=y

# MTU for better throughput
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# BLE connection parameters
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# =============================================================================
# NVS/Settings (for user_settings persistence)
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# =============================================================================
# I2C (Sensors)
# =============================================================================
CONFIG_I2C=y

# =============================================================================
# SPI Flash (External AT25XE161D for data logging)
# =============================================================================
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# Note: Using custom spi_flash driver, not Zephyr SPI-NOR
# The data_log module directly uses our spi_flash.c driver
CONFIG_SPI_NOR=n

# =============================================================================
# ADC (Battery Monitoring)
# =============================================================================
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# =============================================================================
# LEDs
# =============================================================================
CONFIG_LED=y

# =============================================================================
# System Features
# =============================================================================
CONFIG_REBOOT=y

# =============================================================================
# Watchdog Timer - Auto-recovery from hard locks (5 second timeout)
# =============================================================================
CONFIG_WATCHDOG=y

# =============================================================================
# Power Management - Critical for battery life
# =============================================================================
# Note: nRF54L05 uses automatic low-power modes when idle.
# Main power savings come from:
# 1. Efficient BLE advertising intervals (implemented in ble_service.c)
# 2. Sensors only read on demand (not continuously)
# 3. System sleeps between measurements (k_sleep)

# Device runtime power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# For production, these can further reduce power:
# CONFIG_SERIAL=n           # Disable UART completely
# CONFIG_LOG_DEFAULT_LEVEL=0 # Disable all logging

# System OFF mode (shipping/power off state)
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# =============================================================================
# DFU via MCUboot + MCUmgr (OTA Updates)
# =============================================================================

# ZCBOR - required dependency for MCUmgr SMP protocol
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# MCUmgr core - provides SMP protocol for firmware management
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y

# Image management commands (upload, test, confirm, list)
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_MUTEX=y

# OS management commands (reboot, echo)
CONFIG_MCUMGR_GRP_OS=y

# Image manager (handles slot swapping with MCUboot)
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# BLE SMP transport optimization
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Security - require authentication for DFU (uncomment for production)
# CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

# =============================================================================
# BT Mesh (DISABLED - for nRF54L10 later)
# =============================================================================
# CONFIG_BT_MESH=y
