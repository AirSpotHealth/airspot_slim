# AirSpot Slim Firmware
# BLE, NUS, sensors, data logging. MCUboot for J-Link; BLE OTA (MCUmgr) disabled.

# Build output name (creates airspot_slim_v0.9.0.hex instead of zephyr.hex)
CONFIG_KERNEL_BIN_NAME="airspot_slim_v0.13.0"

# =============================================================================
# Basic System Configuration
# =============================================================================
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# =============================================================================
# Logging — UART only (P1.02 TX / P1.03 RX @ 115200 via uart20)
# Optional J-Link RTT: west build ... -- -DEXTRA_CONF_FILE=prj_rtt.conf
# =============================================================================
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_AIRSPOT_LOG_LEVEL=3
CONFIG_SIZE_OPTIMIZATIONS=y

# Power on/off gesture: hold the button 5 s while on the Qi charger
CONFIG_AIRSPOT_BUTTON_LONG_PRESS_TIMEOUT_MS=5000

# Float printf support (for sensor values)
CONFIG_CBPRINTF_FP_SUPPORT=y

# =============================================================================
# Clock (required for peripherals)
# =============================================================================
CONFIG_CLOCK_CONTROL_NRF=y

# =============================================================================
# BLE Configuration
# =============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Device name set dynamically in ble_service.c as "AirSpot-XXXXXX" (MAC suffix)
CONFIG_BT_DEVICE_NAME="AirSpot"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=20
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Battery Service (BAS) - auto-reports battery level
CONFIG_BT_BAS=y

# MTU for better throughput
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# BLE connection parameters
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# Peripheral preferred connection parameters. The Zephyr default supervision
# timeout is 42 (420 ms) which is far too tight: any stall over ~420 ms (flash
# write, I2C busy-wait, radio contention) drops the link with reason 8
# (supervision timeout). Use a robust 4 s timeout. Interval 30-50 ms, no slave
# latency — Apple-compliant (timeout <= 6 s, >= 2 x max_interval).
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# =============================================================================
# NVS/Settings (for user_settings persistence)
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# =============================================================================
# I2C (Sensors)
# =============================================================================
CONFIG_I2C=y

# =============================================================================
# SPI Flash (External AT25XE161D for data logging)
# =============================================================================
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# Note: Using custom spi_flash driver, not Zephyr SPI-NOR
# The data_log module directly uses our spi_flash.c driver
CONFIG_SPI_NOR=n

# =============================================================================
# ADC (Battery Monitoring)
# =============================================================================
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# =============================================================================
# LEDs
# =============================================================================
CONFIG_LED=y

# =============================================================================
# System Features
# =============================================================================
CONFIG_REBOOT=y

# =============================================================================
# Watchdog Timer - Auto-recovery from hard locks (5 second timeout)
# =============================================================================
CONFIG_WATCHDOG=y

# =============================================================================
# Power Management - Critical for battery life
# =============================================================================
# Note: nRF54L05 uses automatic low-power modes when idle.
# Main power savings come from:
# 1. Efficient BLE advertising intervals (implemented in ble_service.c)
# 2. Sensors only read on demand (not continuously)
# 3. System sleeps between measurements (k_sleep)

# Keep UART console powered (do not gate uart20 with runtime PM)
CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y

# For production, these can further reduce power:
# CONFIG_SERIAL=n           # Disable UART completely
# CONFIG_LOG_DEFAULT_LEVEL=0 # Disable all logging

# System OFF mode (shipping/power off state)
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# =============================================================================
# MCUboot (wired J-Link / merged.hex only — BLE OTA disabled)
# =============================================================================
# Used only with: airspot build --bootloader (sysbuild merged.hex)
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y

# Default build is monolithic @ 0x0 (pm_static_mono.yml). MCUboot via sysbuild:
# future OTA; MCUboot child is configured not to swap or touch SPI on boot.
# MCUmgr SMP OTA is off until mobile + image pipeline are validated end-to-end.
#
# Slim is still identified in the mobile app by the SMP UUID in BLE scan response
# (see ble_service.c sd[]); no SMP GATT service is registered while MCUMGR is off.

# =============================================================================
# BT Mesh (DISABLED - for nRF54L10 later)
# =============================================================================
# CONFIG_BT_MESH=y
