# MCUboot for wired J-Link flash (merged.hex). BLE OTA is disabled in the app.
#
# Primary slot: internal flash @ 0xC000 (see pm_static.yml).
# Do NOT enable swap or external SPI here — a bad OTA can leave corrupt swap
# metadata on the AT25XE161D and MCUboot will hang before the application runs
# (no LEDs, no RTT/UART).

# =============================================================================
# Upgrade mode: validate and boot slot 0 only
# =============================================================================
CONFIG_BOOT_SWAP_USING_MOVE=n
CONFIG_BOOT_SWAP_USING_OFFSET=n
CONFIG_BOOT_SWAP_USING_SCRATCH=n

# =============================================================================
# Flash configuration (primary slot only)
# =============================================================================
CONFIG_BOOT_MAX_IMG_SECTORS=128

# =============================================================================
# Image Signature Verification
# =============================================================================
# Use ECDSA P-256 for compatibility with nrfutil DFU package signing
# Path is relative to this file's directory (child_image/); resolves to application/keys/
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="../keys/airspot-signing-key-ecdsa.pem"

# =============================================================================
# Logging (disable in production for faster boot)
# =============================================================================
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_MINIMAL=y

# =============================================================================
# Multithreading (required for flash access)
# =============================================================================
CONFIG_MULTITHREADING=y
