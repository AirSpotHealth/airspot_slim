# MCUboot Configuration for nRF54L05 with External Flash Secondary Slot
#
# Primary slot: Internal RRAM
# Secondary slot: External SPI flash (AT25XE161D)

# =============================================================================
# Upgrade Mode
# =============================================================================
# Swap-move: Efficient upgrade without scratch area
CONFIG_BOOT_SWAP_USING_MOVE=y

# =============================================================================
# External Flash Support
# =============================================================================
# Enable SPI NOR flash driver for secondary slot access
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# =============================================================================
# Flash Configuration
# =============================================================================
# Max sectors for external flash (larger erase blocks)
CONFIG_BOOT_MAX_IMG_SECTORS=256

# =============================================================================
# Image Signature Verification
# =============================================================================
# Use ECDSA P-256 for compatibility with nrfutil DFU package signing
# Custom signing key (NOT the default MCUboot dev key!)
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="/Users/nirajbhatt/airspot/Airspot_firmware/airspot/airspot_slim/application/keys/airspot-signing-key-ecdsa.pem"

# =============================================================================
# Logging (disable in production for faster boot)
# =============================================================================
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_MINIMAL=y

# =============================================================================
# Multithreading (required for flash access)
# =============================================================================
CONFIG_MULTITHREADING=y
