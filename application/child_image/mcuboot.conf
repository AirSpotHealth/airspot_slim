# MCUboot Child Image Configuration for External Flash DFU
# This enables MCUboot to access the external SPI flash for secondary slot

# Enable SPI NOR flash driver in MCUboot
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# Increase max image sectors for external flash (larger erase blocks)
CONFIG_BOOT_MAX_IMG_SECTORS=512

# Enable multithreading for flash access
CONFIG_MULTITHREADING=y
