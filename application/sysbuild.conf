# Sysbuild configuration for AirSpot Slim
# Enables MCUboot bootloader in multi-image build

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Match pm_static.yml mcuboot_pad (0x200); nRF54L sysbuild default is 0x800
SB_CONFIG_PM_MCUBOOT_PAD=0x200

# Use ECDSA P-256 key for DFU package signing and MCUboot image signing.
# Path is relative to west topdir (airspot_slim/). MCUboot also needs
# external/bootloader/mcuboot/application/keys → application/keys (see
# scripts/ensure_mcuboot_key_link.sh, run automatically by airspot build).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="application/keys/airspot-signing-key-ecdsa.pem"
