# Development configuration - Shell and UART enabled for debugging
# Copy this to prj.conf to build development firmware

# GPIO configuration
CONFIG_GPIO=y

# I2C configuration
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# ADC configuration
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# SPI configuration
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# Shell configuration - ENABLED for development
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# UART configuration - ENABLED for development
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# RTT (Real-Time Transfer) debugging via J-Link
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_LOG_BACKEND_RTT=y

# Power management configuration
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_DEVICE_SHELL=y

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AH01_Device"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Development features
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_THREAD_INFO=y

# Floating-point support for printf/shell
CONFIG_CBPRINTF_FP_SUPPORT=y

# Power management
CONFIG_PM_DEVICE_RUNTIME=y



CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y

